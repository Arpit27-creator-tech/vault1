<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <!-- Dot-grid texture, like the app's panels -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="2.5" fill="#1B6B4B" opacity="0.55"/>
    </pattern>

    <!-- Shapes reused for shadow / outline / fill -->
    <circle id="ringShape" cx="512" cy="512" r="300" fill="none"
            stroke-linecap="round" stroke-dasharray="1655 230" stroke-dashoffset="1770"
            transform="rotate(-90 512 512)"/>
    <path id="veeShape" d="M392 440 L512 636 L632 440" fill="none"
          stroke-linecap="round" stroke-linejoin="round"/>
  </defs>

  <!-- Flat dark-green background + dot grid -->
  <rect width="1024" height="1024" fill="#0C3324"/>
  <rect width="1024" height="1024" fill="url(#grid)"/>

  <!-- RING: hard shadow, outline, emerald fill -->
  <use href="#ringShape" stroke="#010503" stroke-width="104" transform="translate(26 26)"/>
  <use href="#ringShape" stroke="#010503" stroke-width="104"/>
  <use href="#ringShape" stroke="#1FB574" stroke-width="76"/>

  <!-- PLATE: hard shadow, outline, cream fill -->
  <circle cx="538" cy="538" r="240" fill="#010503"/>
  <circle cx="512" cy="512" r="240" fill="#010503"/>
  <circle cx="512" cy="512" r="226" fill="#14A9CC"/>

  <!-- V: hard shadow, outline, amber fill -->
  <use href="#veeShape" stroke="#010503" stroke-width="112" transform="translate(16 16)"/>
  <use href="#veeShape" stroke="#010503" stroke-width="112"/>
  <use href="#veeShape" stroke="#FBB724" stroke-width="84"/>

  <!-- Indicator dot: hard shadow, outline, pink fill -->
  <circle cx="522" cy="222" r="48" fill="#010503"/>
  <circle cx="512" cy="212" r="48" fill="#010503"/>
  <circle cx="512" cy="212" r="34" fill="#FF3B5C"/>
</svg>
